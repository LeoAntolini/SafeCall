spring.application.name=safecall-api

# DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/safecall_db
spring.datasource.username=root
spring.datasource.password=safecall123

# JPA
spring.jpa.hibernate.ddl-auto=validate
